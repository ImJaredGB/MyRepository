@if (isLoading) {
  <app-preloader
    (loadingComplete)="onLoadingComplete()">
  </app-preloader>
} @else {
  <main class="page-container">

    <!-- SECTION 01: HOME -->
    <section class="home">

      <div class="intro">
        <div class="introduction">
          <span class="greeting">Me presento</span>

          <h1>Jared García</h1>

          <span class="role">
            [ Desarrollador de software ]
          </span>
        </div>
      </div>

      <div
        class="technologies"
        [style.--lens-x]="lensX + '%'"
        [style.--lens-y]="lensY + '%'"
        (pointermove)="onTechnologyPointerMove($event)"

        >

        @for (technology of technologyLetters; track $index) {
          <div class="technology">
            @for (letter of technology; track $index) {
              <span
                class="technology-letter"
                [class.hidden]="letter.hidden">
                {{ letter.value }}
              </span>
            }
          </div>
        }

        <div class="glass-lens" [class.active]="mouseActive"></div>

      </div>
    </section>

    <!-- SECTION 02: ABOUT -->
    <section class="about">
      <span>Sobre mí</span>
    </section>

  </main>
}
