<div
  class="preloader"
  [class.is-leaving]="isLeaving"
  [class.is-opening]="isOpening">

  <div class="loader-content">
    <span class="percentage">
      {{ progress.toString().padStart(2, '0') }}%
    </span>

    <p class="loading-text">Cargando experiencia</p>
  </div>

  <!-- Línea fina que marca el borde del cuadrado mientras se abre -->
  <div class="reveal-frame" aria-hidden="true"></div>
</div>
